<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hitster Player</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%;
    background:#101014;
    color:#f4f1ea;
    font-family:'Helvetica Neue', Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #ytHost{
    position:absolute;
    width:1px; height:1px;
    opacity:0.001;
    pointer-events:none;
  }
  .stage{
    text-align:center;
    padding:24px;
    width:100%;
    max-width:420px;
  }
  .disc{
    width:150px; height:150px;
    margin:0 auto 24px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, #101014 0 18px, transparent 19px),
      repeating-radial-gradient(circle at center, #2b2a30 0 2px, #17161a 2px 4px);
    border:3px solid #e8483a;
    animation:spin 3s linear infinite paused;
  }
  .disc.playing{animation-play-state:running;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .status{
    font-size:15px;
    letter-spacing:0.03em;
    color:#b9b6c0;
    margin-bottom:6px;
    min-height:20px;
  }
  .hint{
    font-size:12.5px;
    color:#7a7880;
    margin-bottom:18px;
    line-height:1.5;
    min-height:18px;
  }
  .bar-track{
    width:100%;
    height:6px;
    background:#2a2930;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:#e8483a;
    transition:width 0.2s linear;
  }
  button{
    background:#e8483a;
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  button.secondary{
    background:transparent;
    border:1px solid #48464e;
    color:#f4f1ea;
    margin-top:12px;
    font-size:13px;
    padding:10px 20px;
  }
  .err{
    color:#e8483a;
    font-size:13px;
    margin-top:16px;
  }
  .reveal{
    display:none;
    margin-top:8px;
  }
  .reveal .year{
    font-size:30px;
    font-weight:800;
    color:#e8483a;
  }
  .reveal .artist{
    font-size:16px;
    font-weight:700;
    margin-top:8px;
  }
  .reveal .title{
    font-size:14px;
    color:#c9c6cf;
    margin-top:2px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="disc" id="disc"></div>
  <div class="status" id="status">Bereit</div>
  <div class="hint" id="hint">Zum Start Sensor aktivieren</div>
  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  <div id="controls">
    <button id="armBtn">📱 Sensor aktivieren</button>
    <br>
    <button class="secondary" id="manualBtn">Manuell starten (ohne Umdrehen)</button>
  </div>

  <div id="afterControls" style="display:none;">
    <button id="revealBtn">🔎 Auflösen</button>
    <br>
    <button class="secondary" id="replayBtn">↻ Nochmal von vorn</button>
  </div>

  <div class="reveal" id="reveal">
    <div class="year" id="revYear"></div>
    <div class="artist" id="revArtist"></div>
    <div class="title" id="revTitle"></div>
  </div>

  <div class="err" id="err"></div>
</div>

<div id="ytHost"></div>

<script>
  // URL-Parameter: ?v=VIDEOID&s=STARTSEKUNDE&t=TITEL&a=INTERPRET&j=JAHR
  const params = new URLSearchParams(window.location.search);
  const videoId   = params.get('v');
  const startAt   = parseInt(params.get('s') || '0', 10);
  const songTitle = params.get('t') || '';
  const songArtist= params.get('a') || '';
  const songYear  = params.get('j') || '';
  const CLIP_SECONDS = 30;

  const statusEl   = document.getElementById('status');
  const hintEl     = document.getElementById('hint');
  const disc       = document.getElementById('disc');
  const barFill    = document.getElementById('barFill');
  const armBtn     = document.getElementById('armBtn');
  const manualBtn  = document.getElementById('manualBtn');
  const controls   = document.getElementById('controls');
  const afterControls = document.getElementById('afterControls');
  const revealBtn  = document.getElementById('revealBtn');
  const replayBtn  = document.getElementById('replayBtn');
  const revealBox  = document.getElementById('reveal');
  const errEl      = document.getElementById('err');

  if(!videoId){
    statusEl.textContent = 'Kein Song angegeben';
    errEl.textContent = 'Diese Seite braucht einen Link im Format ?v=VIDEO-ID';
    controls.style.display = 'none';
  }

  let player = null;
  let timer = null;
  let elapsed = 0;
  let clipStarted = false;
  let flipStage = 'idle'; // idle -> waiting_facedown -> waiting_faceup -> done

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('ytHost', {
      height: '1', width: '1',
      videoId: videoId,
      playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, start: startAt, playsinline: 1 },
      events: {
        onReady: () => {},
        onError: () => {
          statusEl.textContent = 'Fehler';
          errEl.textContent = 'Dieses Video kann nicht abgespielt werden (evtl. gesperrt oder gelöscht).';
        }
      }
    });
  };
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function startClip(){
    if(!player || clipStarted) return;
    clipStarted = true;
    errEl.textContent = '';
    elapsed = 0;
    barFill.style.width = '0%';
    disc.classList.add('playing');
    statusEl.textContent = 'Läuft …';
    hintEl.textContent = '';
    controls.style.display = 'none';
    afterControls.style.display = 'none';
    revealBox.style.display = 'none';

    player.seekTo(startAt, true);
    player.playVideo();
    player.unMute();

    timer = setInterval(() => {
      elapsed += 0.2;
      const pct = Math.min(100, (elapsed / CLIP_SECONDS) * 100);
      barFill.style.width = pct + '%';
      if(elapsed >= CLIP_SECONDS) stopClip();
    }, 200);
  }

  function stopClip(){
    clearInterval(timer);
    if(player) player.pauseVideo();
    disc.classList.remove('playing');
    statusEl.textContent = 'Zeit abgelaufen';
    hintEl.textContent = '';
    afterControls.style.display = 'block';
  }

  function resetForReplay(){
    clipStarted = false;
    startClip();
  }

  revealBtn.addEventListener('click', () => {
    document.getElementById('revYear').textContent = songYear || '—';
    document.getElementById('revArtist').textContent = songArtist || 'Unbekannt';
    document.getElementById('revTitle').textContent = songTitle || '';
    revealBox.style.display = 'block';
    revealBtn.style.display = 'none';
  });
  replayBtn.addEventListener('click', resetForReplay);
  manualBtn.addEventListener('click', startClip);

  // --- Umdreh-Erkennung (Gyrosensor) ---
  function handleOrientation(e){
    if(clipStarted || e.beta === null) return;
    const beta = e.beta; // -180..180, 0 = flach nach oben, ~180/-180 = flach nach unten
    const isFaceDown = Math.abs(beta) > 150;
    const isFaceUp = Math.abs(beta) < 30;

    if(flipStage === 'waiting_facedown' && isFaceDown){
      flipStage = 'waiting_faceup';
      statusEl.textContent = 'Jetzt umdrehen zum Starten!';
      hintEl.textContent = 'Display nach oben drehen';
    } else if(flipStage === 'waiting_faceup' && isFaceUp){
      flipStage = 'done';
      startClip();
    }
  }

  function armSensor(){
    statusEl.textContent = 'Bereit';
    hintEl.textContent = 'Handy mit Display nach unten auf die Karte legen';
    flipStage = 'waiting_facedown';
    controls.style.display = 'block';
    armBtn.style.display = 'none';
    window.addEventListener('deviceorientation', handleOrientation);
  }

  armBtn.addEventListener('click', () => {
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      // iOS 13+: Berechtigung nötig
      DeviceOrientationEvent.requestPermission().then(result => {
        if(result === 'granted'){
          armSensor();
        } else {
          errEl.textContent = 'Sensor-Zugriff verweigert – nutze „Manuell starten“.';
        }
      }).catch(() => {
        errEl.textContent = 'Sensor nicht verfügbar – nutze „Manuell starten“.';
      });
    } else if('DeviceOrientationEvent' in window){
      armSensor();
    } else {
      errEl.textContent = 'Dieses Gerät unterstützt keinen Bewegungssensor – nutze „Manuell starten“.';
    }
  });
</script>

</body>
</html>
